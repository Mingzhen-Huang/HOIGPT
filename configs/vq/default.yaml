target: hoigpt.archs.hoigpt_vq.VQVae
params:
  quantizer: 'ema_reset'
  code_num: 512
  code_dim: 512
  output_emb_width: 512
  down_t: 2
  stride_t: 2
  width: 512
  depth: 3
  dilation_growth_rate: 3
  norm: None
  activation: 'relu'
  nfeats: ${DATASET.NFEATS}
  ablation: ${ABLATION}
  pointnet: ${model.pn}
  pointnet_checkpoint: ${POINTNET.CHECKPOINT}
  dual_decoder: ${model.dual_decoder}
  dual_codebook: ${model.dual_codebook}

